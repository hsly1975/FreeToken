# FreeToken 生产部署配置（已验证）
#
# 验证环境：X99 双路 + RTX 4070S 12GB（device=1）+ 62GB 内存
# 模型：Ornith-1.5-35B-A3B-NVFP4（MoE 35B-A3B，NVFP4 量化，磁盘 ~24GB）
# 实测：稳态显存 ~11.5G/12G，实际可用上下文 ~8K tokens（KV cache 仅驻 GPU）
#
# 用法：
#   1. 把模型目录放到 /data/models（或改下面 volumes 的左边路径）
#   2. docker compose -f deploy/docker-compose.prod.yml up -d
#   3. curl http://127.0.0.1:1919/v1/models 验证
#
# 字段说明见 deploy/README.md 第 4 节。

services:
  freetoken:
    image: freetoken:latest
    container_name: freetoken-ornith
    # 可选：ipc: host 给 KV cache / 多 worker 更大共享内存。
    # 生产容器用默认 64MB shm 也稳定运行，一般不需要。
    ports:
      - "1919:8000"        # 宿主机 1919 -> 容器 8000（客户端连 1919）
    environment:
      # 可选：下载模型用的代理（按机器情况填，不需要就注释掉）
      # - HTTPS_PROXY=http://192.168.31.10:1082
      # - https_proxy=http://192.168.31.10:1082
      # - NO_PROXY=localhost,127.0.0.1,172.17.0.0/16,192.168.0.0/16
      # - no_proxy=localhost,127.0.0.1,172.17.0.0/16,192.168.0.0/16
    volumes:
      # 宿主机模型目录（只读）挂到容器 /models
      # 目录里要有 Ornith-1.5-35B-A3B-NVFP4 子目录（或改 command 里的 --model）
      - /data/models:/models:ro
    command:
      - "--model"
      - "/models/Ornith-1.5-35B-A3B-NVFP4"   # 容器内路径；也可填 HF repo id 在线下载
      - "--memory-ratio"
      - "0.85"          # 显存占用上限比例（0.85 = 最多用 85% 显存，留余量防 OOM）
      - "--kv-reserve-tokens"
      - "81920"         # KV cache 预留 token 数（配合 memory-ratio 决定实际上下文上限）
      - "--moe-cache-auto"   # MoE 专家 LRU 缓存自动调优（专家权重放内存，GPU 缓存热专家）
      - "--max-prefill-length"
      - "8192"          # 单次 prefill 上限 8K（12GB 卡实测安全值，防长 prompt OOM）
      - "--host"
      - "0.0.0.0"       # 监听所有网卡（局域网可访问）；只本机用改 127.0.0.1
      - "--port"
      - "8000"          # 容器内端口（与 ports 右边对应）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]   # 4070S 是 device 1；若它是唯一 GPU 改成 ["0"] 或删掉这行用 count: all
              capabilities: [gpu]
    restart: unless-stopped   # 异常退出自动拉起（手动 stop 除外）
